<div class="container py-3">
  @if (!canList && !canCreate) {
    <div class="text-center mt-5">
      <h4>No tienes permisos para este módulo</h4>
      <a routerLink="/home" class="btn btn-primary mt-3">Volver al inicio</a>
    </div>
  } @else {
    @if (canCreate) {
      <app-dish-create-fragment />
    }
    @if (canList) {
      <app-dish-list-fragment />
    }
  }
</div>
