<div class="container py-4">
  @if (!canList && !canCreate) {
    <div class="text-center mt-5">
      <h4>No tienes permisos para el módulo de Etiquetas</h4>
      <a routerLink="/dashboard" class="btn btn-primary mt-3"> Volver al dashboard </a>
    </div>
  } @else {
    <div class="row justify-content-center">
      <div class="col-12 col-lg-8">
        @if (canCreate) { <app-tag-create-fragment /> }
        @if (canList) { <app-tag-list-fragment /> }
      </div>
    </div>
  }
</div>
